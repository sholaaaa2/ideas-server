<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Ideas</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" defer></script>
    <script src="js/app.js" defer></script>
</head>

<body>
    <header class="header" id="appHeader" hidden>
        <div class="container header__inner">
            <a class="logo" href="#">
                IDEAS
            </a>
            <div class="header__actions">
                <button class="button button--primary" id="addIdeaBtn" type="button">
                    + Додати ідею
                </button>
                <button class="button button--secondary" id="logoutBtn" type="button">
                    Вийти
                </button>
            </div>
        </div>
    </header>

    <main class="main" id="appContent" hidden>
        <div class="container">
            <div class="page-heading">
                <div>
                    <h1>Ідеї для роликів</h1>
                    <p>
                        Референси та сценарії для майбутніх відео.
                    </p>
                </div>

                <div class="filters">
                    <div class="filter-field filter-field--search">
                        <input type="search" id="searchInput" placeholder="Пошук за назвою...">
                    </div>

                    <div class="filter-field">
                        <input type="search" id="locationFilter" placeholder="Локація...">
                    </div>

                    <div class="filter-field">
                        <select id="difficultyFilter">
                            <option value="">
                                Складність(-)
                            </option>
                            <option value="low">
                                Низька
                            </option>
                            <option value="mid">
                                Середня
                            </option>
                            <option value="high">
                                Висока
                            </option>
                        </select>
                    </div>

                    <button class="button button--secondary" id="resetFilters" type="button">
                        Скинути
                    </button>
                </div>
            </div>

            <div class="card-grid" id="ideasGrid"></div>

            <div class="empty-state" id="emptyState" hidden>
                <div class="empty-state__icon">
                    ✦
                </div>

                <h2>
                    Ідей поки немає
                </h2>

                <p>
                    Додай першу ідею для ролика.
                </p>

                <button class="button button--primary" id="emptyAddBtn" type="button">
                    Додати ідею
                </button>
            </div>
        </div>
    </main>

    <div class="modal modal--locked" id="loginModal" aria-hidden="true">
        <div class="modal__backdrop"></div>

        <div class="modal__dialog modal__dialog--small">
            <div class="auth-logo">
                IDEAS
            </div>

            <h2 class="modal__title">
                Авторизація
            </h2>

            <p class="modal__subtitle">
                Увійди в акаунт, щоб переглянути ідеї.
            </p>

            <form id="loginForm">
                <div class="form-field">
                    <label for="loginName">
                        Логін
                    </label>
                    <input id="loginName" name="name" type="text" autocomplete="username" required>
                </div>

                <div class="form-field">
                    <label for="loginPassword">
                        Пароль
                    </label>
                    <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
                </div>

                <div class="form-error" id="loginError"></div>

                <button class="button button--primary button--wide" type="submit">
                    Увійти
                </button>
            </form>
        </div>
    </div>

    <div class="modal" id="ideaModal" aria-hidden="true">
        <div class="modal__backdrop" data-close-modal></div>

        <div class="modal__dialog">
            <button class="modal__close" type="button" data-close-modal>
                ×
            </button>

            <h2 class="modal__title">
                Нова ідея
            </h2>

            <form id="createIdeaForm">
                <div class="form-field">
                    <label>
                        Назва ідеї
                    </label>
                    <input name="title" type="text" required placeholder="Наприклад: Реакція перехожих">
                </div>

                <div class="form-field">
                    <label>
                        Посилання на референс
                    </label>
                    <input name="url" type="url" placeholder="Instagram, TikTok або YouTube">
                </div>

                <div class="scripts-section">
                    <div class="scripts-section__header">
                        <div>
                            <h3>Сценарії</h3>
                            <p>
                                Можна додати будь-яку кількість.
                            </p>
                        </div>

                        <button class="button button--outline button--small add-script" type="button">
                            + Сценарій
                        </button>
                    </div>

                    <div class="scripts-editor" data-scripts-editor></div>
                </div>

                <div class="form-error" id="createIdeaError"></div>

                <div class="modal__footer">
                    <button class="button button--secondary" type="button" data-close-modal>
                        Скасувати
                    </button>

                    <button class="button button--primary" type="submit">
                        Створити
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal" id="detailsModal" aria-hidden="true">
        <div class="modal__backdrop" data-close-modal></div>

        <div class="modal__dialog modal__dialog--large">
            <button class="modal__close" type="button" data-close-modal>
                ×
            </button>

            <div id="ideaDetailsView"></div>
            <div id="ideaEditView" hidden></div>
        </div>
    </div>

    <div class="modal" id="deleteModal" aria-hidden="true">
        <div class="modal__backdrop"></div>

        <div class="modal__dialog modal__dialog--tiny">
            <div class="danger-icon">
                !
            </div>

            <h2 class="modal__title modal__title--center">
                Видалити ідею?
            </h2>

            <p class="modal__subtitle modal__subtitle--center">
                Цю дію неможливо буде скасувати.
            </p>

            <div class="confirm-actions">
                <button class="button button--secondary" id="cancelDeleteBtn" type="button">
                    Скасувати
                </button>

                <button class="button button--danger" id="confirmDeleteBtn" type="button">
                    Видалити
                </button>
            </div>
        </div>
    </div>
</body>

</html>
